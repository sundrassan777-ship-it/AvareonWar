[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow-running (multi-turn AI simulations)
    benchmark: marks hardware-dependent FPS benchmarks (manual runs, not CI)
filterwarnings =
    ignore::DeprecationWarning
